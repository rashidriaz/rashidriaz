<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient></defs>
  <rect width="1200" height="300" fill="url(#bgp)"/>
  <g transform="translate(0,20)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.45s" fill="freeze"/>
    <rect width="380" height="260" rx="14" fill="#151b26" stroke="#2a3342" stroke-width="1.5"/>
    <rect width="380" height="260" rx="14" fill="none" stroke="#2f6fed" stroke-width="1.5" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" begin="1.00s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#eef2f7">DocFlow</text>
    <rect x="300.4" y="24" width="55.6" height="22" rx="11" fill="#0d1117" stroke="#2fbd6f"/>
    <text x="328.2" y="39" font-size="10.5" font-weight="700" fill="#2fbd6f" text-anchor="middle" letter-spacing="0.5">PUBLIC</text>
    <text x="24" y="100" font-size="13" fill="#8b94a3">Windows desktop app converting PDFs,</text>
      <text x="24" y="120" font-size="13" fill="#8b94a3">scans, and Office docs into clean</text>
      <text x="24" y="140" font-size="13" fill="#8b94a3">structured HTML for LLM/RAG pipelines.</text>
      <text x="24" y="160" font-size="13" fill="#8b94a3">Hexagonal architecture, 3 releases.</text>
      <rect x="24" y="214" width="58.4" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="53.2" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">Python</text>
      <rect x="90.4" y="214" width="52.0" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="116.4" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">PyQt6</text>
      <rect x="150.4" y="214" width="39.2" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="170.0" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">OCR</text>
  </g>
  <g transform="translate(400,20)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.45s" fill="freeze"/>
    <rect width="380" height="260" rx="14" fill="#151b26" stroke="#2a3342" stroke-width="1.5"/>
    <rect width="380" height="260" rx="14" fill="none" stroke="#2f6fed" stroke-width="1.5" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" begin="1.40s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#eef2f7">Urma</text>
    <rect x="300.4" y="24" width="55.6" height="22" rx="11" fill="#0d1117" stroke="#2f6fed"/>
    <text x="328.2" y="39" font-size="10.5" font-weight="700" fill="#2f6fed" text-anchor="middle" letter-spacing="0.5">CLIENT</text>
    <text x="24" y="100" font-size="13" fill="#8b94a3">Portfolio + CMS for a jewellery</text>
      <text x="24" y="120" font-size="13" fill="#8b94a3">designer. Full custom admin panel so a</text>
      <text x="24" y="140" font-size="13" fill="#8b94a3">non-technical client manages all</text>
      <text x="24" y="160" font-size="13" fill="#8b94a3">content.</text>
      <rect x="24" y="214" width="84.0" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="66.0" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">Next.js 15</text>
      <rect x="116" y="214" width="90.4" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="161.2" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">Payload CMS</text>
      <rect x="214.4" y="214" width="103.2" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="266.0" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">Framer Motion</text>
  </g>
  <g transform="translate(800,20)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.45s" fill="freeze"/>
    <rect width="380" height="260" rx="14" fill="#151b26" stroke="#2a3342" stroke-width="1.5"/>
    <rect width="380" height="260" rx="14" fill="none" stroke="#2f6fed" stroke-width="1.5" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" begin="1.80s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="42" font-size="20" font-weight="700" fill="#eef2f7">Darzee</text>
    <rect x="267.4" y="24" width="88.6" height="22" rx="11" fill="#0d1117" stroke="#c98a2e"/>
    <text x="311.7" y="39" font-size="10.5" font-weight="700" fill="#c98a2e" text-anchor="middle" letter-spacing="0.5">IN PROGRESS</text>
    <text x="24" y="100" font-size="13" fill="#8b94a3">Tailor-shop management platform with</text>
      <text x="24" y="120" font-size="13" fill="#8b94a3">order tracking and WhatsApp status</text>
      <text x="24" y="140" font-size="13" fill="#8b94a3">notifications.</text>
      <rect x="24" y="214" width="64.8" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="56.4" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">Next.js</text>
      <rect x="96.80000000000001" y="214" width="71.2" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="132.4" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">Supabase</text>
      <rect x="176" y="214" width="103.2" height="24" rx="12" fill="#0d1117" stroke="#2a3342"/>
      <text x="227.6" y="226" font-size="11" font-weight="600" fill="#8b94a3" text-anchor="middle" dominant-baseline="middle">Cloudflare R2</text>
  </g>
</svg>
