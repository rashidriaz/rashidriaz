<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><linearGradient id="bgt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient></defs>
  <rect width="1200" height="260" fill="url(#bgt)"/>

  <line x1="140" y1="90" x2="1060" y2="90" stroke="#2a3342" stroke-width="2"/>
  <line x1="140" y1="90" x2="1060" y2="90" stroke="#2f6fed" stroke-width="2" stroke-dasharray="920" stroke-dashoffset="920">
    <animate attributeName="stroke-dashoffset" from="920" to="0" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.23 1 0.32 1"/>
  </line>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.40s" dur="0.4s" fill="freeze"/>
    
    <circle cx="140" cy="90" r="8" fill="#3a4456" stroke="#2a3342" stroke-width="2"/>
    <text x="140" y="66" font-size="16" font-weight="700" fill="#eef2f7" text-anchor="middle">Software Engineer</text>
    <text x="140" y="86" font-size="13" font-weight="600" fill="#6f9bf5" text-anchor="middle">Bytofire Ltd.</text>
    <text x="140" y="120" font-size="12" fill="#8b94a3" text-anchor="middle">Nov 2022 – Mar 2024</text>
    <text x="140" y="142" font-size="11.5" fill="#8b94a3" text-anchor="middle">React/TypeScript · Cypress/Playwright</text>
    
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.4s" fill="freeze"/>
    
    <circle cx="600" cy="90" r="8" fill="#3a4456" stroke="#2a3342" stroke-width="2"/>
    <text x="600" y="66" font-size="16" font-weight="700" fill="#eef2f7" text-anchor="middle">Full Stack Engineer</text>
    <text x="600" y="86" font-size="13" font-weight="600" fill="#6f9bf5" text-anchor="middle">Sensys LLC</text>
    <text x="600" y="120" font-size="12" fill="#8b94a3" text-anchor="middle">Mar 2024 – May 2026</text>
    <text x="600" y="142" font-size="11.5" fill="#8b94a3" text-anchor="middle">Multi-tenant SaaS · Auth · Payments · Kafka</text>
    
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.90s" dur="0.4s" fill="freeze"/>
    
      <circle cx="1060" cy="90" r="9" fill="none" stroke="#2f6fed" stroke-width="2" opacity="0.6">
        <animate attributeName="r" from="9" to="26" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.55" to="0" dur="2s" repeatCount="indefinite"/>
      </circle>
    <circle cx="1060" cy="90" r="8" fill="#2f6fed" stroke="#2f6fed" stroke-width="2"/>
    <text x="1060" y="66" font-size="16" font-weight="700" fill="#eef2f7" text-anchor="middle">Senior Software Engineer</text>
    <text x="1060" y="86" font-size="13" font-weight="600" fill="#6f9bf5" text-anchor="middle">YieldWerx Semiconductor</text>
    <text x="1060" y="120" font-size="12" fill="#8b94a3" text-anchor="middle">Jun 2026 – Present</text>
    <text x="1060" y="142" font-size="11.5" fill="#8b94a3" text-anchor="middle">Post-Processing · Wafer Control Map · Cube</text>
    <text x="1060" y="164" font-size="10.5" font-weight="700" fill="#2f6fed" text-anchor="middle" letter-spacing="1">NOW</text>
  </g>
</svg>
